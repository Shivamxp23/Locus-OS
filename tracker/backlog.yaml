      - "locus_cli/install.py supports non-interactive mode via --yes --answers <file.json>."
      - "Validates prerequisites: Python 3, Node 18+, Docker (if mode requires it), and git."
      - "Creates ~/.locus/ and ~/.locus/config.yaml using defaults if answers file specifies them."
      - "A test exercises the non-interactive install with a temporary answers file."
    demo: 'Run py -3 -m locus_cli.install --yes --answers tests/fixtures/install_answers.json --target-dir <temp_dir>: creates config.yaml and exits 0.'

