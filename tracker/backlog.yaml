      - "install.ps1 and install.sh are thin launchers under 50 lines that verify Python 3.11+, bootstrap the virtualenv, and invoke locus_cli.main."
      - "Non-interactive installation supports --yes and --answers flags, creating ~/.locus/config.yaml, jobs/, and the 8 canonical vault folders."
    demo: 'Run py -3 tools/guard/check.py --full: layout-required passes with 0 FAIL. In a temporary directory, run py -3 -m locus_cli.main --yes: it initializes ~/.locus without prompting, creates the config file and canonical vault directory hierarchy, and exits with code 0.'

