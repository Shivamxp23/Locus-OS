# tracker/backlog.yaml - the Product Backlog. HUMAN-OWNED (AGENTS.md law 11).
#
# ORDER = PRIORITY. The story at the top is built first. Only the owner changes the order.
# Agents change this file only inside a P5 refinement session; the owner commits it with LOCUS_ALLOW_GUARD_EDIT=1.
# Nobody types a status here: tools/tracker/backlog.py derives it from git, tracker/handoff/, and tracker/status.json.
# A story = ONE slice of ONE tracker feature that fits in 1 to 3 evening slots (points 1, 2 or 3). Bigger: split it.
# A story is READY (may enter a sprint) only when it has points, a feature, a slug, accept, demo, target_level,
# no OPEN decision in requires_decisions, and every depends_on story merged. `backlog.py --check` and `--refine` say what is missing.
# Stories far down the list are deliberately coarse; refinement (prompt P5) makes the next ones Ready.
#
# Fields: id, epic, feature (F-xxxx), slug, title, points, target_level (the computed level the feature must reach: 2 SYMBOLS,
# 3 UNIT_VERIFIED, 4 INTEGRATED), completes_feature (true = after you accept it you also record proof and sign off 100%),
# depends_on (stories above), requires_decisions (rows of docs/agent/09-spec-errata.md), addendum (P4 = installer/security rules),
# accept (observable criteria the verifier checks one by one), demo (what YOU watch at the Sprint Review).
schema: 1
config:
  main_branch: main
  first_sprint_start: 2026-10-14   # started today. Sprints are 14 days.
  sprint_days: 14
  slot_days: [Mon, Tue, Wed, Thu, Fri]       # active work days
  slot_time: "19:30"
  capacity_points: 4               # used until 3 sprints have closed; then the average of the last 3 velocities (rounded down, 2 to 8)
  max_story_points: 3
  wip_limit: 1                     # one story in progress at a time (AGENTS.md law 12)
  refine_top: 5                    # refinement looks at this many unstarted stories

epics:
  - id: E1
    title: Green baseline
    goal: "One layout, no known security hole, the guard shows 0 FAIL and the hooks are on."
  - id: E2
    title: Modularity foundation
    goal: "Every feature reads config and registers as a provider through one accessor and one registry."
  - id: E3
    title: Headless runtime
    goal: "A research job runs on the VM by itself and the owner hears about it on Telegram."
  - id: E4
    title: One-command installer
    goal: "One command sets up local, VM or hybrid, with keys and Telegram pairing."
  - id: E5
    title: Memory, vault and audit
    goal: "Everything is recorded and backed up to the vault; Neo4j Agent Memory is the memory layer."
  - id: E6
    title: Priority and meta-harness
    goal: "Every task at every scale gets a priority score; Locus drives other harnesses."

stories:
  # ------------------------------------------------------------------ E1 Green baseline (Sprint 1)
  - id: US-01
    epic: E1
    feature: F-0084
    slug: one-layout
    title: "Remove core/, the junction and the shim so the repo has one layout"
    points: 2
    target_level: 3
    autopilot: false   # by hand: you approve the discard table and a junction must never be deleted by a script
    accept:
      - "py -3 tools/guard/check.py --full reports no FAIL for forbidden-path, reparse-point, py-import-core, core-alias-shim, core-module-run and core-path-in-scripts."
      - "Only files the owner approved in the handoff's discard table are removed, in one discard(US-01) commit; every module worth keeping lives exactly once under sidecar/ with all imports fixed in the same commit."
      - "A unit test imports each surviving sidecar module and asserts that importlib.util.find_spec('core') is None."
    demo: 'Run py -3 tools\guard\check.py --full: the six layout checks print no FAIL. Look at the top level of locus-os in File Explorer: there is no core folder and no folder with a shortcut arrow.'

  - id: US-02
    epic: E1
    feature: F-0087
    slug: pi-bridge-flags
    title: "Every runtime Pi launch passes --approve --no-context-files in the repo folder (S-3)"
    points: 1
    target_level: 3
    accept:
      - "sidecar/pi_bridge.py defines run_pi_turn and get_node_executable, and the guard ids must-define and pi-bridge-flags pass."
      - "Sidecar, cron, Telegram and conductor start Pi only through run_pi_turn; a unit test with a fake Pi executable asserts that the argument list contains --approve and --no-context-files and that the working folder is the repo root."
      - "The string --dangerously-skip-permissions appears nowhere in the repo."
    demo: 'Run py -3 tools\guard\check.py --full: pi-bridge-flags prints no FAIL. Run the flags test file named in the handoff with py -3 -m pytest -q <that file>: it prints passed.'

  - id: US-03
    epic: E1
    feature: F-0086
    slug: couchdb-secrets-ports
    title: "CouchDB password comes from .env and every port binds to 127.0.0.1 (S-2)"
    points: 1
    target_level: 3
    addendum: [P4]
    accept:
      - "docker-compose.yml has no default password and uses ${COUCHDB_PASSWORD:?set it in .locus/.env}: docker compose config fails with that message when it is unset and succeeds when it is set."
      - "Every published port (5984, 7687, 5432, 6379, 8420) is written as 127.0.0.1:port:port."
      - "data/couchdb/local.ini limits CORS origins to app://obsidian.md, capacitor://localhost and http://localhost."
      - "The old default password string appears nowhere in the repo (the guard secrets check stays green) and a unit test parses docker-compose.yml to prove the three points above."
      - "The handoff says how an already-initialised data directory gets the new admin password (CouchDB applies COUCHDB_PASSWORD only when it creates the admin, so an existing data folder keeps the old one) and gives the exact commands; after them the previous login is rejected."
    demo: 'In PowerShell run: $env:COUCHDB_PASSWORD=""; docker compose config   (it must fail with the message). Then set a long random value, run docker compose up -d couchdb and open http://127.0.0.1:5984 (it answers). From your phone on the same Wi-Fi open http://<this PC address>:5984 (it must NOT connect). Then run curl.exe -s -o NUL -w "%{http_code}" -u <your old user>:<your old password> http://127.0.0.1:5984/   (it must print 401). Then docker compose down.'

  - id: US-04
    epic: E1
    feature: F-0083
    slug: telegram-pairing
    title: "Telegram pairing: one-time code, fail closed, nobody becomes owner by messaging first (S-1)"
    points: 2
    target_level: 3
    addendum: [P4]
    accept:
      - "The six pairing tests from docs/agent/10-security.md S-1 exist and pass: a stranger's first message is rejected; a wrong code is rejected and counted; the right code pairs once; reuse of the code fails; a corrupted allow-list fails closed; a restart keeps the owner."
      - "The code has 8 or more characters from the secrets module, is valid 10 minutes, works once, only its hash is stored, 5 wrong attempts lock pairing for 15 minutes, and it is printed only on the machine running setup. The owner's numeric Telegram id is stored in LOCUS_HOME/config.yaml exactly as S-1 says."
      - "Until paired the bot answers every message with one fixed line and executes nothing; if the allowed-id list cannot be read or written the bot refuses all messages; webhook mode refuses to start without TELEGRAM_WEBHOOK_SECRET."
    demo: 'With a TEST bot token on this PC (never the real one): start the bot. From a second Telegram account send hello: the bot answers the one fixed line. Run the pairing command on the PC, read the code on its screen, send /pair <code> from your own account: it says paired. Send /pair <code> from the second account: refused. Restart the bot: your account still works and the second account still gets the fixed line.'

  # ------------------------------------------------------------------ E2 Modularity foundation (Sprint 2)
  - id: US-05
    epic: E2
    feature: F-0125
    slug: config-accessor
    title: "One config accessor for Python and TypeScript (get, is_enabled)"
    points: 2
    target_level: 3
    requires_decisions: [D-10]
    accept:
      - "sidecar/config.py defines get(path, default=None) and is_enabled(path) and reads the config file at the location chosen in errata D-10; locus-extension/src/config.ts offers the same two functions over the same file."
      - "A missing key returns the default; is_enabled is false when the key is absent or false; no module outside the accessor reads os.environ, process.env or the config file directly (a unit test searches for it)."
      - "py -3 -m sidecar.config get <path> prints the value (or the default), so any key can be checked by hand."
    demo: 'Run py -3 -m sidecar.config get locus.demo.value (prints the default). Add locus.demo.value: 7 to the config file at the D-10 location and run it again: it prints 7. Run the unit tests named in the handoff: they pass.'

  - id: US-06
    epic: E2
    feature: F-0125
    slug: provider-registry
    title: "One provider registry with on/off switch, swap by config, and health check"
    points: 2
    target_level: 4
    completes_feature: true
    depends_on: [US-05]
    accept:
      - "sidecar/registry.py defines ProviderRegistry and get_registry(); a provider registers under (interface, name); the active provider is chosen by the config key locus.<area>.<feature>.provider."
      - 'When a feature''s enabled switch is false: its HTTP routes answer 503 with {"disabled": "<config key>"}, its tools are not registered and its jobs are not scheduled (one test per behaviour, using a dummy feature).'
      - "Swap test: two dummy providers for one interface; changing the config key switches behaviour with no code edit. Health test: every registered provider answers health_check()."
      - "locus-extension/src/registry.ts offers the same register/get and the same off behaviour for tools."
    demo: 'Run the three tests the handoff names (off, swap, health): each prints passed. Then set the dummy feature''s enabled key to false in the config file and call its route: it answers 503 and names the disabled key.'

  # ------------------------------------------------------------------ E3 Headless runtime (coarse: refine before planning)
  - id: US-07
    epic: E3
    feature: F-0046
    slug: telegram-gateway
    title: "Telegram gateway as a ChannelProvider: a paired owner message gets a Pi reply, everyone else is ignored"
    points: 3
    target_level: 3
    depends_on: [US-02, US-04, US-06]
    accept:
      - "sidecar/channel_telegram.py implements the ChannelProvider interface and registers under ('channel', 'telegram') in ProviderRegistry."
      - "When locus.channel.telegram.enabled is false, the gateway does not connect to Telegram or poll for updates."
      - "Inbound messages from the paired owner chat ID trigger run_pi_turn and stream/reply the generated answer back to the owner's Telegram chat."
      - "Messages from any chat ID other than the paired owner are rejected/ignored with no execution or leak of system info."
      - "Webhook mode requires TELEGRAM_WEBHOOK_SECRET and fails closed if unset."
    demo: 'With a TEST bot token on this PC: start the Telegram channel provider. Send a message from an unpaired test account: the bot ignores or returns the fixed denial line. Send a message from the paired owner account: the bot invokes Pi via run_pi_turn and returns Pi''s response to the chat. Disable locus.channel.telegram.enabled in config: the provider disconnects and stops polling.'

  - id: US-08
    epic: E3
    feature: F-0058
    slug: research-cron
    title: "Scheduler runs one owner-defined research job through run_pi_turn and writes the result to the vault"
    points: 3
    target_level: 3
    requires_decisions: [D-15, D-16]
    depends_on: [US-02, US-06]
    accept:
      - "sidecar/scheduler.py loads research jobs matching the D-15 format from LOCUS_HOME/jobs/ or locus.research.jobs."
      - "When scheduled, the job triggers sidecar/cron_runner.py with session_id='cron_<job_id>', executing the job's prompt via run_pi_turn."
      - "The output of the research turn is written to the configured destination in vault/ (e.g. vault/05-Daily/Research/YYYY-MM-DD-<name>.md)."
      - "A run log entry is recorded in the execution log table with timestamp, status, token usage, and output path."
      - "Respects locus.scheduler.enabled: when disabled, no jobs fire."
    demo: 'Place a test job test_research.yaml in LOCUS_HOME/jobs/ with a 1-minute schedule and destination vault/05-Daily/Research/test.md. Start the scheduler. Wait for the job to fire: verify test.md is created in the vault with Pi''s output and verify the run is logged. Stop the scheduler and remove the test job.'

  - id: US-09
    epic: E3
    feature: F-0046
    slug: deliver-result
    title: "A finished job sends its result and its run record to the paired owner on Telegram"
    points: 2
    target_level: 4
    depends_on: [US-07, US-08]
    accept:
      - "When a research job finishes, sidecar/cron_runner.py checks if notify is enabled and dispatches output to the registered ChannelProvider."
      - "The notification delivered to the paired owner includes the job title, execution status, timestamp, and the research text body."
      - "If the formatted output exceeds 4096 characters, chunk_message splits the payload so the entire result is sent across sequential Telegram messages without truncation."
      - "If channel delivery encounters an error or if no channel is configured, the error is recorded in the run log and the scheduler continues running unaffected."
    demo: 'With a test Telegram token and paired chat ID: run a research job configured with notify: true. Verify the paired owner chat receives the research summary and completion status. Verify messages exceeding 4096 chars arrive as ordered chunks. Verify cron_executions logs delivery status.'

  - id: US-10
    epic: E3
    feature: F-0058
    slug: headless-service
    title: "Sidecar, Pi bridge and scheduler start from a service; a restart keeps the job store and the job still fires"
    points: 2
    target_level: 4
    depends_on: [US-08]
    accept:
      - "sidecar/service.py defines a unified service lifecycle that boots the sidecar API daemon and the APScheduler background runner."
      - "Clean signal handling for SIGINT and SIGTERM stops the scheduler and waits for in-flight jobs to complete or abort safely."
      - "The job store and execution history persist across process restarts, and jobs scheduled via crontab continue firing on schedule after a service reboot."
    demo: 'Start sidecar daemon service via python -m sidecar.service in background. Probe http://127.0.0.1:8420/health: both sidecar API and scheduler report ok. Kill the service with SIGTERM: it shuts down gracefully. Restart the service: all scheduled research jobs reload from LOCUS_HOME/jobs/ and fire on time.'

