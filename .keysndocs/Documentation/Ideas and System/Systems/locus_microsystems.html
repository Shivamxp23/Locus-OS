<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locus OS — Micro-System Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #FAFAFA;
  --surface:  #FFFFFF;
  --border:   #DDDDDD;
  --border2:  #CCCCCC;
  --text:     #222222;
  --muted:    #555555;
  --muted2:   #888888;
  --accent:   #C4813F;
  --accent-l: rgba(196,129,63,0.12);
  --accent-b: rgba(196,129,63,0.25);
  --s-work:   #4A7C59;
  --s-part:   #C4813F;
  --s-plan:   #3A6A9C;
  --s-none:   #777777;
  --s-idea:   #7A5A9C;
  --s-broke:  #9C4A4A;
  --s-data:   #4A8080;
  --font:     'IBM Plex Mono', 'Courier New', monospace;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ── HEADER ── */
header {
  flex-shrink: 0;
  padding: 16px 24px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: baseline;
  gap: 20px;
}
header h1 {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 4px;
  color: var(--accent);
  text-transform: uppercase;
}
header .sub {
  font-size: 9px;
  color: var(--muted2);
  letter-spacing: 2px;
  text-transform: uppercase;
}
header .counts {
  margin-left: auto;
  font-size: 8px;
  color: var(--muted2);
  letter-spacing: 1.5px;
}

/* ── APP SHELL ── */
.shell {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  width: 196px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 12px 0 20px;
  background: var(--bg);
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.grp-label {
  font-size: 7.5px;
  letter-spacing: 2.5px;
  color: var(--muted2);
  text-transform: uppercase;
  padding: 12px 14px 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2px;
}
.sys-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 6px 14px;
  background: none;
  border: none;
  font-family: var(--font);
  font-size: 9px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
}
.sys-btn:hover { color: var(--accent); background: var(--accent-l); }
.sys-btn.active { color: var(--accent); background: var(--accent-l); border-right: 2px solid var(--accent); }
.sys-btn .dot {
  width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0;
}

/* ── MAIN PIPELINE VIEW ── */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
  transition: padding-right 0.3s;
}
.main::-webkit-scrollbar { width: 4px; }
.main::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
.main.panel-open { padding-right: 340px; }

.sys-header {
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.sys-badges { display: flex; gap: 8px; margin-bottom: 10px; }
.badge {
  display: inline-block;
  font-size: 7.5px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 2px;
  border: 1px solid currentColor;
}
.sys-title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text);
  margin-bottom: 6px;
}
.sys-tagline {
  font-size: 10px;
  color: var(--muted);
  line-height: 1.6;
  letter-spacing: 0.5px;
  max-width: 600px;
}

/* ── STEP CHAIN ── */
.steps-chain {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0;
  max-width: 680px;
}

.step-wrap {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  width: 100%;
}

.step-card {
  width: 100%;
  display: flex;
  align-items: flex-start;
  gap: 0;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.step-card:hover { border-color: var(--accent); }
.step-card.active { border-color: var(--accent); background: #FEF9F5; box-shadow: 0 0 0 1px var(--accent); }

.step-num-col {
  flex-shrink: 0;
  width: 44px;
  padding: 14px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  border-right: 1px solid var(--border);
}
.step-num {
  font-size: 10px;
  font-weight: 600;
  color: var(--muted2);
  letter-spacing: 1px;
}
.step-status-dot {
  width: 6px; height: 6px; border-radius: 50%;
}

.step-body {
  flex: 1;
  padding: 12px 14px;
}
.step-name {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text);
  margin-bottom: 5px;
}
.step-brief {
  font-size: 9px;
  color: var(--muted);
  line-height: 1.65;
  letter-spacing: 0.3px;
}

.step-arrow {
  width: 1px;
  height: 12px;
  background: var(--border2);
  margin-left: 21px;
  position: relative;
}
.step-arrow::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: -3px;
  width: 0;
  height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid var(--border2);
}

/* branch indicator */
.branch-line {
  height: 12px;
  margin-left: 21px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.branch-line::before {
  content: '';
  display: block;
  width: 1px;
  height: 12px;
  background: var(--border2);
}
.branch-label {
  font-size: 7.5px;
  color: var(--muted2);
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* ── DETAIL PANEL ── */
.panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 0;
  height: 100%;
  overflow: hidden;
  transition: width 0.3s ease;
  z-index: 100;
}
.panel.open { width: 320px; }
.panel-inner {
  width: 320px;
  height: 100%;
  background: var(--surface);
  border-left: 1px solid var(--border2);
  overflow-y: auto;
  padding: 20px;
}
.panel-inner::-webkit-scrollbar { width: 4px; }
.panel-inner::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.panel-close {
  float: right;
  background: none;
  border: none;
  font-family: var(--font);
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--muted2);
  cursor: pointer;
  text-transform: uppercase;
  padding: 2px 0;
}
.panel-close:hover { color: var(--accent); }

.panel-step-num {
  font-size: 8px;
  color: var(--muted2);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 6px;
  margin-top: 8px;
  clear: both;
}
.panel-step-name {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text);
  margin-bottom: 14px;
  line-height: 1.4;
}
.panel-desc {
  font-size: 10px;
  color: #333;
  line-height: 1.8;
  margin-bottom: 16px;
}
.panel-section-label {
  font-size: 7.5px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted2);
  margin-bottom: 5px;
  padding-bottom: 3px;
  border-bottom: 1px solid var(--border);
}
.panel-list {
  list-style: none;
  margin-bottom: 14px;
}
.panel-list li {
  font-size: 9px;
  color: var(--muted);
  padding: 3px 0;
  letter-spacing: 0.3px;
  line-height: 1.5;
}
.panel-list li::before { content: '→ '; color: var(--accent); }

.panel-status-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.panel-status-label {
  font-size: 7.5px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted2);
}
.panel-status-badge {
  font-size: 7.5px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 2px;
  border: 1px solid currentColor;
}

/* provider badge */
.panel-provider {
  font-size: 8px;
  color: var(--accent);
  letter-spacing: 1px;
  margin-top: 8px;
}

/* empty state */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 50vh;
  gap: 12px;
}
.empty-state .big { font-size: 32px; opacity: 0.15; }
.empty-state p { font-size: 10px; color: var(--muted2); letter-spacing: 1.5px; text-transform: uppercase; }
</style>
</head>
<body>

<header>
  <h1>Locus OS</h1>
  <div class="sub">Micro-System Design</div>
  <div class="counts" id="hCounts"></div>
</header>

<div class="shell">

  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar"></nav>

  <!-- MAIN -->
  <main class="main" id="main">
    <div class="empty-state">
      <div class="big">◈</div>
      <p>Select a system to inspect its micro-steps</p>
    </div>
  </main>

  <!-- DETAIL PANEL -->
  <aside class="panel" id="panel">
    <div class="panel-inner" id="panelInner"></div>
  </aside>

</div>

<script>
// ─── STATUS CONFIG ──────────────────────────────────────────────────────────
const STATUS = {
  working:    { label: "Working",         color: "#4A7C59" },
  partial:    { label: "Partial",         color: "#C4813F" },
  planned:    { label: "Planned",         color: "#3A6A9C" },
  none:       { label: "Not Built",       color: "#777777" },
  idea:       { label: "Idea",            color: "#7A5A9C" },
  broken:     { label: "Broken",          color: "#9C4A4A" },
  data:       { label: "Data Collection", color: "#4A8080" },
};

// ─── SYSTEM DATA ────────────────────────────────────────────────────────────
const SYSTEMS = [

// ══════════════════════════════════════════════════════════════════════════════
// TIER 0 — MASTER
// ══════════════════════════════════════════════════════════════════════════════
{
  id: "master", tier: "T0", category: "Tier 0 · Master", status: "partial",
  title: "Master Conductor",
  tagline: "Top of the pyramid. Receives every input. Decides every pipeline invocation. Manages LLM cascade, owns /brain/chat, handles graceful degradation.",
  steps: [
    { n:1,  name:"Input Reception",         status:"partial",
      desc:"Receives all incoming triggers: Telegram webhook payloads, Voice transcription outputs, AI Chat Archiver completions, and Inner Loop observation objects. Each input is timestamped and assigned a priority class — P1 for user-interactive (requires immediate response), P2 for automated (archiver, cron), P3 for scheduled (morning briefing, Inner Loop proactive). Priority class determines timeout budget and LLM tier selection.",
      inputs:["Telegram webhook","Voice WebRTC / Twilio stream","Archiver cron output","Inner Loop observation queue"],
      outputs:["Prioritized + timestamped input object with source tag"],
      provider: null },
    { n:2,  name:"Security Pre-Filter",     status:"partial",
      desc:"Fast first-pass security before any downstream invocation. Runs three checks in parallel: (1) regex scan for shell injection patterns — sudo, exec, rm -rf, curl pipe patterns; (2) blocklist lookup against known adversarial prompt prefixes; (3) private data scope check — confirms the request doesn't contain SSNs, passwords, card numbers. Any failed check returns REJECTED with reason code before the Query Router is touched.",
      inputs:["Raw input object from Reception"],
      outputs:["Sanitized input object OR rejected event with reason_code"],
      provider: "groq-8b (semantic check only if regex unclear)" },
    { n:3,  name:"Source Classification",   status:"partial",
      desc:"Determines the nature of the input to configure downstream pipeline behaviour. Source classes: USER_INTERACTIVE (real-time Telegram/Voice — requires full pipeline, fast response), INNER_LOOP_SURFACE (Inner Loop observation approved for delivery), SCHEDULED_TRIGGER (cron-fired events like morning briefing), ARCHIVER_INGEST (new vault content — no response needed, triggers Collector). Source class sets: response_required flag, timeout_budget (4s / 8s / 30s), output_channel.",
      inputs:["Sanitized input + source tag"],
      outputs:["Source class, response_required flag, timeout_budget, output_channel"],
      provider: null },
    { n:4,  name:"Query Router Dispatch",   status:"none",
      desc:"For USER_INTERACTIVE inputs only: hands off to the Query Router for intent classification. Passes the sanitized message + source class. Waits synchronously for the Routing Manifest (intent type, source list, temporal scope, deep reasoning flag). If Query Router times out (> 800ms), falls back to ALL-SOURCES routing with SYNTHESIS intent — never fails silently.",
      inputs:["Sanitized user message"],
      outputs:["Routing Manifest from Query Router"],
      provider: "groq-8b (Query Router call)" },
    { n:5,  name:"LLM Tier Selection",      status:"partial",
      desc:"Selects the appropriate LLM tier based on routing manifest flags. Tier logic: deep_reasoning=false + simple intent → Groq 8b-instant (50–150 token response, <500ms); deep_reasoning=true + behavioral/synthesis intent → Cerebras 70b (conversational, 1s); INFERENCE_REQUEST or emotional state → DeepSeek V4 Flash (nuanced, multi-turn context); Sunday synthesis + vault queries → Gemini 2.5 Pro (1M context window). Checks token quota in Redis before each call. Auto-downgrades if rate limit approaching.",
      inputs:["Routing Manifest intent + deep_reasoning flag", "Redis token counters"],
      outputs:["Selected LLM provider + model + token budget"],
      provider: "cascade: groq-8b → cerebras-70b → deepseek-v4-flash → gemini-2.5-pro" },
    { n:6,  name:"Parallel Retrieval Coordination", status:"none",
      desc:"Forks retrieval calls in parallel based on sources_required from the Routing Manifest. Simultaneously invokes: Retriever Mode A (Qdrant semantic) if KNOWLEDGE_RETRIEVAL, Retriever Mode B (PostgreSQL structured) if FACTUAL_PERSONAL/TASK_PLANNING, Retriever Mode C (Neo4j graph) if BEHAVIORAL_PATTERN, Web Searcher if EXTERNAL_KNOWLEDGE. All calls have a hard 3-second timeout — missing sources are noted as unavailable, never substituted with hallucination.",
      inputs:["Routing Manifest sources_required list", "Temporal scope"],
      outputs:["Parallel retrieval results (partial OK — never blocked)"],
      provider: null },
    { n:7,  name:"Context Forge Invocation", status:"none",
      desc:"Hands all parallel retrieval results to Context Forge for assembly into the 800-token context block. Passes: retrieval results with scores, current temporal context (DCS, mode, time), user identity snapshot. Context Forge returns a single assembled block. Master Conductor does not touch the context assembly logic — that is Context Forge's domain.",
      inputs:["Retrieval results","CURRENT_STATE from Redis","User Identity snapshot"],
      outputs:["Assembled 800-token context block"],
      provider: null },
    { n:8,  name:"LLM API Call + Fallback",  status:"partial",
      desc:"Calls the selected LLM with the assembled context block. Implements cascade fallback: if primary provider returns 429 (rate limit) or 5xx, automatically tries the next provider tier. Tracks: call latency, tokens used (input + output), provider used, success/failure. All errors written to brain_errors table in PostgreSQL. Hard max: 3 retry attempts before returning a graceful degradation response to the user.",
      inputs:["Assembled context block","Selected LLM provider","System prompt"],
      outputs:["LLM response text","Tokens used","Provider used","Latency ms"],
      provider: "whichever tier was selected in step 5" },
    { n:9,  name:"Response Post-Processing", status:"none",
      desc:"Takes raw LLM response text and applies: (1) LOCUS_SHORTHAND expansion — decode any compressed tokens in the response for human readability; (2) hallucination check — if response references data that wasn't in the context block, flag as potential hallucination and append caveat; (3) format adaptation — strip markdown formatting for Telegram output, preserve for Dashboard. Response is now ready for delivery.",
      inputs:["Raw LLM response text","Context block (for hallucination check)"],
      outputs:["Formatted, expanded, verified response"],
      provider: null },
    { n:10, name:"Behavioral Event Emission", status:"none",
      desc:"Every successful LLM interaction emits a behavioral event to PostgreSQL. Event schema: {type: INTERACTION, timestamp, intent_type, provider_used, input_tokens, output_tokens, sources_used[], response_latency_ms, session_id}. This event triggers the State Engine update cycle. The event stream is the chronological truth record — never skipped even in error paths (errors emit their own event type BRAIN_ERROR).",
      inputs:["Interaction metadata (intent, provider, tokens, latency)"],
      outputs:["behavioral_event row in PostgreSQL","State Engine trigger"],
      provider: null },
    { n:11, name:"Output Channel Delivery",  status:"partial",
      desc:"Routes the processed response to the correct output channel based on output_channel from step 3. USER_INTERACTIVE → Telegram sendMessage API with 👍/👎 inline keyboard. SCHEDULED → Telegram push with rate limit check (max 3 unprompted/day). INNER_LOOP_SURFACE → Telegram with observation prefix. ARCHIVER_INGEST → no response, only internal events. Calendar events are written via Calendar Bridge. Dashboard updates are written to Redis.",
      inputs:["Formatted response","Output channel type","Telegram bot API"],
      outputs:["Delivered message to user","Calendar event (if applicable)","Redis cache update"],
      provider: "Telegram Bot API" },
  ]
},

// ══════════════════════════════════════════════════════════════════════════════
// TIER 1 — ORCHESTRATION
// ══════════════════════════════════════════════════════════════════════════════
{
  id: "router", tier: "T1", category: "Tier 1 · Orchestration", status: "none",
  title: "Query Router",
  tagline: "The first thing every user message hits. Single cheap LLM call. Returns a Routing Manifest: intent type, sources to query, temporal scope, deep reasoning flag.",
  steps: [
    { n:1, name:"Receive Raw Message",        status:"none",
      desc:"Accepts the sanitized input string from Master Conductor. At this point it is a plain string — no metadata yet. The Query Router's job is purely classification: it knows nothing about databases, retrieval, or LLM providers. It only answers: 'what kind of question is this, and where should we look?'",
      inputs:["Sanitized user message string"],
      outputs:["Message ready for classification"],
      provider: null },
    { n:2, name:"Build Classifier Prompt",    status:"none",
      desc:"Constructs a compact system + user prompt for the classifier call. System prompt defines all 8 intent categories with examples: FACTUAL_PERSONAL ('what tasks did I defer last week?'), BEHAVIORAL_PATTERN ('why do I always avoid creative work on Mondays?'), KNOWLEDGE_RETRIEVAL ('summarise my notes on neuromorphic computing'), TASK_PLANNING ('plan my day'), EMOTIONAL_STATE ('I'm feeling overwhelmed'), EXTERNAL_KNOWLEDGE ('what is Dijkstra's algorithm?'), SYNTHESIS ('connect my film work to my CS skills'), INFERENCE_REQUEST ('what's causing my current slump?'). Prompt includes confidence score requirement.",
      inputs:["User message","Intent category definitions"],
      outputs:["Classifier prompt (<200 tokens total)"],
      provider: null },
    { n:3, name:"Groq 8b-instant Classification Call", status:"none",
      desc:"Single Groq 8b-instant API call. Fast, cheap (<0.001¢), deterministic with temperature=0. Expected response: structured JSON with intent_type, sources_required (array), temporal_scope (TODAY/WEEK/MONTH/ALLTIME), deep_reasoning (bool), confidence (0-1). Response enforced as JSON via Groq's structured output mode — never free-text parsing. Target latency: < 300ms.",
      inputs:["Classifier prompt"],
      outputs:["Raw JSON: {intent_type, sources_required, temporal_scope, deep_reasoning, confidence}"],
      provider: "groq-8b-instant (temperature=0, json_mode=true)" },
    { n:4, name:"Confidence Gate",             status:"none",
      desc:"If confidence < 0.7 — meaning the classifier isn't sure what type of question this is — override sources_required to ALL_SOURCES. The cost of retrieving more is low; the cost of missing a source is hallucination. If confidence ≥ 0.7, use the returned source list exactly. This gate is the primary anti-hallucination mechanism at the routing level.",
      inputs:["Parsed JSON from classification call"],
      outputs:["Final sources_required list (overridden if confidence < 0.7)"],
      provider: null },
    { n:5, name:"Temporal Scope Resolution",   status:"none",
      desc:"Converts abstract temporal scope to concrete timestamps. TODAY → today 00:00 to 23:59 IST. WEEK → last 7 days. MONTH → last 30 days. ALLTIME → no lower bound. These timestamps are passed directly to Retriever Mode B for SQL WHERE clauses and to Retriever Mode A for Qdrant recency filtering. Avoids ambiguity at the retrieval layer.",
      inputs:["temporal_scope from classification","Current timestamp"],
      outputs:["start_ts and end_ts Unix timestamps"],
      provider: null },
    { n:6, name:"Return Routing Manifest",     status:"none",
      desc:"Assembles and returns the complete Routing Manifest to Master Conductor. Format: {intent_type, sources_required[], start_ts, end_ts, deep_reasoning, confidence, classifier_latency_ms}. The manifest is authoritative — all downstream components follow it exactly. The manifest is also emitted as a behavioral event for monitoring the classifier's accuracy over time.",
      inputs:["All resolved classification outputs"],
      outputs:["Routing Manifest object to Master Conductor"],
      provider: null },
  ]
},
{
  id: "inner", tier: "T1", category: "Tier 1 · Orchestration", status: "none",
  title: "Inner Loop",
  tagline: "Fires without you saying anything. Every 90 minutes during active hours. At 03:00 IST for deep synthesis. Thinks about you. Surfaces 0–2 evidence-based observations. The Samantha layer.",
  steps: [
    { n:1,  name:"APScheduler Trigger",        status:"none",
      desc:"Two trigger types. Ambient: APScheduler fires every 90 minutes between 07:00 and 00:00 IST during active hours. Deep: APScheduler fires once at 03:00 IST every night for the full synthesis pass. Trigger type determines context depth — ambient uses 6h events, deep uses 48h events + Pattern Engine outputs. Both types run the same downstream pipeline; only context window changes.",
      inputs:["APScheduler cron job (90min / nightly 03:00 IST)"],
      outputs:["trigger_type: AMBIENT or DEEP, trigger_timestamp"],
      provider: null },
    { n:2,  name:"CURRENT_STATE Read",          status:"none",
      desc:"Read CURRENT_STATE from Redis cache. This is the State Engine's continuously updated multi-dimensional snapshot: mood_trend, stress_level, energy_level, current_mode, momentum_score, deferral_rate, active_alerts[], last_meaningful_work_ts, exam_period_flag, sleep_quality, inferred_cause_chain_summary. If the cache is expired (TTL exceeded) or Redis is unavailable, the Inner Loop reads the last state_snapshot row from PostgreSQL instead — never skips.",
      inputs:["Redis CURRENT_STATE key (TTL 6h)","PostgreSQL state_snapshots (fallback)"],
      outputs:["Multi-dimensional state object"],
      provider: null },
    { n:3,  name:"Behavioral Alerts Pull",      status:"none",
      desc:"Reads active behavioral alerts from Pattern Engine's detected_patterns table: patterns flagged as alert_active=true within the last 48h. Examples: 'creative task deferral velocity increasing — 4 deferrals in 3 days', 'faction Health/Stability starved — 0 hours in 5 days'. These are the specific anomalies the Inner Loop should reason about. Alerts are ranked by severity and recency.",
      inputs:["PostgreSQL detected_patterns WHERE alert_active=true AND detected_at > NOW()-48h"],
      outputs:["Active alert list, ranked by severity"],
      provider: null },
    { n:4,  name:"Recent Events Compression",   status:"none",

    { n:4,  name:"Layer 2 — Temporal Context (60t)", status:"none",

      inputs:["CURRENT_STATE (mode, DCS)","faction_weekly_stats (lag scores)","System clock (IST)"],

// ─── UTILITY ────────────────────────────────────────────────────────────────
function statusConfig(key) {
  return STATUS[key] || { label: key, color: "#888" };
}

function statusDot(key, size = 6) {
  const s = statusConfig(key);
  return `<span class="step-status-dot" style="background:${s.color};width:${size}px;height:${size}px"></span>`;
}

function badgeHTML(text, color) {
  return `<span class="badge" style="color:${color};border-color:${color}">${text}</span>`;
}

// ─── COUNTS ─────────────────────────────────────────────────────────────────
const totalSystems = SYSTEMS.length;
const totalSteps = SYSTEMS.reduce((a, s) => a + s.steps.length, 0);
document.getElementById('hCounts').textContent =
  `${totalSystems} systems · ${totalSteps} micro-steps`;

// ─── BUILD SIDEBAR ───────────────────────────────────────────────────────────
const sidebarEl = document.getElementById('sidebar');
const groups = {};
SYSTEMS.forEach(sys => {
  if (!groups[sys.category]) groups[sys.category] = [];
  groups[sys.category].push(sys);
});

Object.entries(groups).forEach(([cat, systems]) => {
  const label = document.createElement('div');
  label.className = 'grp-label';
  label.textContent = cat;
  sidebarEl.appendChild(label);

  systems.forEach(sys => {
    const btn = document.createElement('button');
    btn.className = 'sys-btn';
    btn.dataset.id = sys.id;
    const sc = statusConfig(sys.status);
    btn.innerHTML = `<span class="dot" style="background:${sc.color}"></span>${sys.title.split(' — ')[0].substring(0,22)}`;
    btn.addEventListener('click', () => selectSystem(sys.id));
    sidebarEl.appendChild(btn);
  });
});

// ─── STATE ────────────────────────────────────────────────────────────────────
let activeSysId = null;
let activeStepId = null;

// ─── SELECT SYSTEM ───────────────────────────────────────────────────────────
function selectSystem(id) {
  const sys = SYSTEMS.find(s => s.id === id);
  if (!sys) return;
  activeSysId = id;
  activeStepId = null;

  // Sidebar active
  document.querySelectorAll('.sys-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.sys-btn[data-id="${id}"]`)?.classList.add('active');

  // Close detail panel
  closePanel();

  // Render pipeline
  const mainEl = document.getElementById('main');
  const sc = statusConfig(sys.status);

  mainEl.innerHTML = `
    <div class="sys-header">
      <div class="sys-badges">
        ${badgeHTML(sys.tier, '#777')}
        ${badgeHTML(sc.label.toUpperCase(), sc.color)}
      </div>
      <h2 class="sys-title">${sys.title}</h2>
      <p class="sys-tagline">${sys.tagline}</p>
    </div>
    <div class="steps-chain" id="stepsChain"></div>
  `;

  const chain = document.getElementById('stepsChain');
  sys.steps.forEach((step, i) => {
    const stepSC = statusConfig(step.status);
    const wrap = document.createElement('div');
    wrap.className = 'step-wrap';

    const card = document.createElement('div');
    card.className = 'step-card';
    card.dataset.sid = sys.id;
    card.dataset.stepN = step.n;
    card.innerHTML = `
      <div class="step-num-col">
        <div class="step-num">${String(step.n).padStart(2,'0')}</div>
        <div class="step-status-dot" style="background:${stepSC.color}"></div>
      </div>
      <div class="step-body">
        <div class="step-name">${step.name}</div>
        <div class="step-brief">${step.desc.substring(0, 120)}${step.desc.length > 120 ? '…' : ''}</div>
      </div>
    `;
    card.addEventListener('click', () => openStep(sys.id, step.n));
    wrap.appendChild(card);

    if (i < sys.steps.length - 1) {
      const arrow = document.createElement('div');
      arrow.className = 'step-arrow';
      wrap.appendChild(arrow);
    }

    chain.appendChild(wrap);
  });
}

// ─── OPEN STEP DETAIL ────────────────────────────────────────────────────────
function openStep(sysId, stepN) {
  const sys = SYSTEMS.find(s => s.id === sysId);
  if (!sys) return;
  const step = sys.steps.find(s => s.n === stepN);
  if (!step) return;

  activeStepId = stepN;

  // Highlight active step card
  document.querySelectorAll('.step-card').forEach(c => c.classList.remove('active'));
  document.querySelector(`.step-card[data-sid="${sysId}"][data-step-n="${stepN}"]`)
    ?.classList.add('active');

  const stepSC = statusConfig(step.status);

  const inputsHTML = step.inputs && step.inputs.length
    ? `<div class="panel-section-label" style="margin-bottom:6px">Inputs</div>
       <ul class="panel-list">${step.inputs.map(i => `<li>${i}</li>`).join('')}</ul>`
    : '';

  const outputsHTML = step.outputs && step.outputs.length
    ? `<div class="panel-section-label" style="margin-bottom:6px">Outputs</div>
       <ul class="panel-list">${step.outputs.map(o => `<li>${o}</li>`).join('')}</ul>`
    : '';

  const providerHTML = step.provider
    ? `<div class="panel-provider">⟁ ${step.provider}</div>`
    : '';

  document.getElementById('panelInner').innerHTML = `
    <button class="panel-close" onclick="closePanel()">✕ close</button>
    <div class="panel-step-num">${sys.title.toUpperCase()} · STEP ${String(step.n).padStart(2,'0')}</div>
    <div class="panel-step-name">${step.name}</div>
    <div class="panel-desc">${step.desc}</div>
    ${inputsHTML}
    ${outputsHTML}
    ${providerHTML}
    <div class="panel-status-row">
      <span class="panel-status-label">Status</span>
      <span class="panel-status-badge" style="color:${stepSC.color};border-color:${stepSC.color}">${stepSC.label.toUpperCase()}</span>
    </div>
  `;

  // Open panel
  document.getElementById('panel').classList.add('open');
  document.getElementById('main').classList.add('panel-open');
}

// ─── CLOSE PANEL ─────────────────────────────────────────────────────────────
function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('main').classList.remove('panel-open');
  document.querySelectorAll('.step-card').forEach(c => c.classList.remove('active'));
  activeStepId = null;
}

// ─── DEFAULT: first system ───────────────────────────────────────────────────
selectSystem('master');
</script>
</body>
</html>
